<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Daily News</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .tagline {
            font-size: 1rem;
            color: #555;
            margin-top: 0;
            margin-bottom: 20px;
        }
        nav {
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            padding: 10px 0;
            margin-bottom: 20px;
        }
        nav a {
            color: #0044cc;
            text-decoration: none;
            font-size: 0.95rem;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .separator {
            color: #ae1f1f;
            margin: 0 10px;
        }
        .category {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }
        .headline {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }
        .logo-container {
            max-width: 450px;
            margin-top: 10px;
        }
        .logo-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1>Global Daily News</h1>
        <p class="tagline">Your Trusted Source for Latest Updates</p>
        
        <nav>
            <a href="#">World</a><span class="separator">|</span>
            <a href="#">Sports</a><span class="separator">|</span>
            <a href="#">Entertainment</a><span class="separator">|</span>
            <a href="#">Podcast</a><span class="separator">|</span>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <div class="category">World News</div>
        <div class="headline">
            Today's top headline: Global leaders meet to discuss climate change initiatives.
        </div>
        
        <div class="logo-container">
            <!-- Replace the src URL with your actual image path if hosted locally -->
            <img src="https://wikimedia.org" alt="BBC World News">
        </div>
    </main>

</body>
</html>
